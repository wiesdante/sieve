name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Check tag matches project version
        id: version
        shell: bash
        run: |
          version=$(python scripts/project_version.py --check "${GITHUB_REF_NAME}")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build executable
        run: |
          python scripts/make_version_info.py
          pyinstaller sieve.spec --noconfirm --clean

      - name: Smoke test
        timeout-minutes: 3
        run: |
          $process = Start-Process -FilePath "dist\Sieve\Sieve.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\Sieve\logs\sieve.log" -ErrorAction SilentlyContinue
            throw "Smoke test failed with exit code $($process.ExitCode)"
          }
          Get-Content "$env:LOCALAPPDATA\Sieve\logs\sieve.log"

      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\sieve.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sieve-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/*.exe

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/release_notes.py "$VERSION" > release-notes.md
          gh release create "$GITHUB_REF_NAME" "dist/installer/Sieve-Setup-${VERSION}.exe" \
            --title "Sieve ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
