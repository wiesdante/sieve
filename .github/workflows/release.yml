name: Release

# A release is published automatically whenever main contains a version
# (src/sieve/__init__.py) that has not been released yet. The workflow creates
# the vX.Y.Z tag itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Check for a new version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5

      - name: Compare project version with existing releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/project_version.py)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v${version} is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${version} is new and will be released."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and publish Windows installer
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build executable
        run: |
          python scripts/make_version_info.py
          pyinstaller sieve.spec --noconfirm --clean

      - name: Smoke test
        timeout-minutes: 3
        run: |
          $process = Start-Process -FilePath "dist\Sieve\Sieve.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\Sieve\logs\sieve.log" -ErrorAction SilentlyContinue
            throw "Smoke test failed with exit code $($process.ExitCode)"
          }
          Get-Content "$env:LOCALAPPDATA\Sieve\logs\sieve.log"

      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ env.VERSION }}" installer\sieve.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: Sieve-Setup-${{ env.VERSION }}
          path: dist/installer/*.exe

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_notes.py "$VERSION" > release-notes.md
          gh release create "v${VERSION}" "dist/installer/Sieve-Setup-${VERSION}.exe" \
            --target "$GITHUB_SHA" \
            --title "Sieve ${VERSION}" \
            --notes-file release-notes.md
