name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint & test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install ruff pytest requests packaging PySocks PyMuPDF beautifulsoup4 dnspython

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          SIEVE_NETWORK_TESTS: "1"
        run: pytest -q

      - name: CHANGELOG has an entry for the current version
        run: python scripts/release_notes.py "$(python scripts/project_version.py)" > /dev/null

  browser:
    name: Browser (Windows, Edge)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest requests packaging PySocks beautifulsoup4 dnspython playwright

      - name: Test with Microsoft Edge
        env:
          SIEVE_BROWSER_TESTS: "1"
        run: pytest -q tests/test_browser_live.py tests/test_browser_choice.py tests/test_site_discovery.py
