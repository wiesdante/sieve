name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install ruff pytest requests packaging PySocks

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: CHANGELOG has an entry for the current version
        run: python scripts/release_notes.py "$(python scripts/project_version.py)" > /dev/null
